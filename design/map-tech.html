<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha384-sHL9NAb7lN7rfvG5lfHpm643Xkcjzp4jFvuavGOndn6pjVqS6ny56CAt3nsEVT4H" crossorigin="anonymous">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha384-cxOPjt7s7Iz04uaHJceBmS+qpjv2JkIHNVcuOrM+YHwZOmJGBXI00mdUXEq65HTH" crossorigin="anonymous"></script>
<style>
  html,body{margin:0;padding:0;height:100%;font-family:'Inter',-apple-system,sans-serif}
  #map{height:100%;width:100%;background:#eef1f5}
  .leaflet-container{font-family:'Inter',-apple-system,sans-serif}
  .dest{width:30px;height:30px;border-radius:50%;background:#ffdc39;color:#000b49;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;border:2.5px solid #fff;box-shadow:0 3px 9px rgba(0,11,73,.35)}
  .me{width:16px;height:16px;border-radius:50%;background:#0a7a63;border:3px solid #fff;box-shadow:0 0 0 5px rgba(10,122,99,.22)}
  .leaflet-popup-content{margin:10px 12px;font-size:12.5px;line-height:1.5}
  .leaflet-popup-content b{color:#000b49;font-size:13.5px}
</style>
</head>
<body>
<div id="map"></div>
<script>
const dest = [-26.0186, 28.0106];   // 12 Montrose Avenue, Fourways
const me   = [-26.0512, 28.0270];   // technician current position

const map = L.map('map', { zoomControl: false, scrollWheelZoom: false, attributionControl: true }).setView(dest, 13);
L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
  attribution: '© OpenStreetMap contributors', maxZoom: 19,
}).addTo(map);

L.polyline([me, [-26.0392, 28.0198], [-26.0271, 28.0142], dest], {
  color: '#000b49', weight: 4, opacity: .75, lineCap: 'round',
}).addTo(map);

L.marker(me, { icon: L.divIcon({ className: '', html: '<div class="me"></div>', iconSize: [16, 16], iconAnchor: [8, 8] }) })
  .addTo(map).bindPopup('<b>You</b><br>Bryanston');

L.marker(dest, { icon: L.divIcon({ className: '', html: '<div class="dest">3</div>', iconSize: [30, 30], iconAnchor: [15, 15] }) })
  .addTo(map).bindPopup('<b>Ridwaan Patel</b><br>12 Montrose Avenue, Fourways<br>09:30 · collection');

map.fitBounds(L.latLngBounds([me, dest]), { padding: [46, 46] });
</script>
</body>
</html>
